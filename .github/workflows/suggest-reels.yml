name: Suggest Reels

on:
  schedule:
    - cron: "0 10 * * 0"   # Sundays 10:00 UTC (10 AM Irish winter time, 11 AM summer)
  workflow_dispatch:        # "Run workflow" button: get ideas any time

permissions:
  contents: write

concurrency:
  group: repo-writes   # shared with the hourly watcher
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install telethon==1.46.0 anthropic==2.14.0

      - name: Make Reel suggestions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/suggest.py

      - name: Save suggestions
        run: |
          git config user.name "reel-suggester"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suggestions || true
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add Reel suggestions"
            git pull --rebase
            git push
          fi
