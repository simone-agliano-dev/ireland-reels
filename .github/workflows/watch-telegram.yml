name: Watch Telegram channel

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17
  workflow_dispatch:        # "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: repo-writes   # shared with the weekly suggestions job
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache speech-to-text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Pull new videos
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python scripts/watch.py

      - name: Tag clips with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/tag.py

      - name: Save new clip metadata
        if: always()   # keep progress even if tagging failed
        run: |
          git config user.name "telegram-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clips state
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add new clips from Telegram"
            git pull --rebase
            git push
          fi
